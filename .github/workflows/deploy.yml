name: Deploy

# Körs när CI har gått grönt på main, eller för hand (Actions -> Deploy -> Run workflow).
# Det som deployas är alltså alltid testat.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

# En deploy i taget; avbryts aldrig mitt i.
concurrency:
  group: bookmark-deploy
  cancel-in-progress: false

env:
  IMAGE: passwordnotsafe/bookmark-dashboard
  # Mappen på servern där compose-filen ligger och containern startas.
  DEPLOY_DIR: /home/repos/my-bookmark-sync

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          # Samma commit som CI testade, inte det som råkar ligga på main just nu.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Import secrets from Vault
        uses: hashicorp/vault-action@v3
        with:
          url: https://vault.jarllindquist.com
          method: approle
          roleId: ${{ secrets.VAULT_ROLE_ID }}
          secretId: ${{ secrets.VAULT_SECRET_ID }}
          secrets: |
            kv/data/server-deploy SSH_HOST | SERVER_HOST ;
            kv/data/server-deploy SSH_USERNAME | SERVER_USER ;
            kv/data/server-deploy SERVER_PORT | SERVER_PORT ;
            kv/data/server-deploy SSH_PRIVATE_KEY | SERVER_PRIVATE_KEY ;
            kv/data/server-deploy SSH_HOST_FINGERPRINT | SSH_HOST_FINGERPRINT ;
            kv/data/server-deploy DOCKER_USERNAME | DOCKER_USERNAME ;
            kv/data/server-deploy DOCKER_PASSWORD | DOCKER_PASSWORD

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKER_USERNAME }}
          password: ${{ env.DOCKER_PASSWORD }}

      - name: Build and push the image
        uses: docker/build-push-action@v5
        with:
          context: dashboard
          push: true
          cache-from: type=registry,ref=${{ env.IMAGE }}:latest
          cache-to: type=inline
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.event.workflow_run.head_sha || github.sha }}

      # De två appleboy-stegen får SSH-nyckeln: låsta till en commit, och de kontrollerar serverns
      # identitet mot fingeravtrycket i Vault i stället för att lita på vilken server som helst.
      - name: Copy the compose file to the server
        uses: appleboy/scp-action@ff85246acaad7bdce478db94a363cd2bf7c90345 # v1.0.0
        with:
          host: ${{ env.SERVER_HOST }}
          username: ${{ env.SERVER_USER }}
          key: ${{ env.SERVER_PRIVATE_KEY }}
          port: ${{ env.SERVER_PORT }}
          fingerprint: ${{ env.SSH_HOST_FINGERPRINT }}
          source: docker-compose.prod.yml
          target: ${{ env.DEPLOY_DIR }}

      - name: Start on the server
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ env.SERVER_HOST }}
          username: ${{ env.SERVER_USER }}
          key: ${{ env.SERVER_PRIVATE_KEY }}
          port: ${{ env.SERVER_PORT }}
          fingerprint: ${{ env.SSH_HOST_FINGERPRINT }}
          envs: DEPLOY_DIR
          script: |
            set -e
            cd "$DEPLOY_DIR"
            # Imagen är publik på Docker Hub, så ingen inloggning behövs på servern.
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d --remove-orphans
            docker image prune -f

      - name: Check that the dashboard answers
        run: |
          for i in $(seq 1 20); do
            if curl -fsS -o /dev/null https://jarllindquist.com/bookmarks/; then echo "jarllindquist.com/bookmarks svarar"; exit 0; fi
            sleep 3
          done
          echo "jarllindquist.com/bookmarks svarade inte efter deployen"
          exit 1
