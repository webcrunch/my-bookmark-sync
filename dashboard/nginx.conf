# Traefik tar bort /bookmarks innan anropet kommer hit, så appen ligger i roten.
server {
    listen 80;
    root /usr/share/nginx/html;

    # Filnamnen har en hash i sig och kan cachas länge; index.html aldrig, så en ny version syns direkt.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    location ~* \.(js|css|ico|png|svg|woff2?)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Traefik kontrollerar att containern lever
    location = /health {
        access_log off;
        return 200 "ok";
    }
}
