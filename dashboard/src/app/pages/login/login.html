<div class="flex min-h-screen items-center justify-center bg-slate-950 px-4 text-slate-100">
  <div class="w-full max-w-sm rounded-2xl border border-slate-800 bg-slate-900 p-8 text-center shadow-xl">
    <img src="favicon.svg" width="56" height="56" alt="" class="mx-auto mb-3 h-14 w-14">
    <h1 class="mb-1 text-xl font-bold text-white">BookmarkHub</h1>
    <p class="mb-6 text-sm text-slate-400">Logga in för att se och sortera bokmärkena.</p>

    @if (!auth.waiting()) {
      <button type="button" (click)="auth.startLogin()"
        class="w-full rounded-lg bg-indigo-600 px-4 py-2.5 font-semibold text-white transition-colors hover:bg-indigo-500">
        Logga in med Telegram
      </button>
    } @else {
      <div class="mb-4 flex justify-center">
        <span class="h-3 w-3 animate-ping rounded-full bg-indigo-400"></span>
      </div>
      <button type="button" (click)="auth.cancelLogin()"
        class="w-full rounded-lg border border-slate-700 px-4 py-2.5 text-slate-300 transition-colors hover:bg-slate-800">
        Avbryt
      </button>
    }

    @if (auth.message()) {
      <p class="mt-4 text-sm text-slate-300" role="status">{{ auth.message() }}</p>
    }
  </div>
</div>
