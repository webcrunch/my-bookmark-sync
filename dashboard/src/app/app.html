@if (auth.loggedIn()) {
  <div class="flex h-screen bg-slate-950 text-slate-100 overflow-hidden">
    <!-- Fast Sidebar -->
    <app-sidebar></app-sidebar>

    <!-- Huvudinnehåll som byts ut via Router -->
    <main class="flex-1 overflow-y-auto p-8">
      <router-outlet></router-outlet>
    </main>
  </div>
} @else {
  <!-- Utloggad, eller n8n svarade 401: inloggningen visas i stället för sidorna -->
  <app-login></app-login>
}
