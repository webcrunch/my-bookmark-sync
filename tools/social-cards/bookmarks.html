<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>BookmarkHub card</title>
  <link rel="stylesheet" href="card.css" />
</head>

<body>
  <div class="card">
    <!-- A folder tree: links flowing in from Chrome, sorted into folders, one suggestion from the AI (violet) -->
    <div class="picture">
      <svg viewBox="0 0 410 340" aria-hidden="true" font-family="Segoe UI, Arial, sans-serif" font-size="22">
        <g fill="#334155">
          <rect x="0" y="6" width="190" height="44" rx="10" />
          <rect x="40" y="70" width="170" height="44" rx="10" />
          <rect x="40" y="134" width="170" height="44" rx="10" />
          <rect x="80" y="198" width="150" height="44" rx="10" />
        </g>
        <g fill="#cbd5e1">
          <text x="18" y="36">Bookmarks bar</text>
          <text x="58" y="100">Reading</text>
          <text x="58" y="164">Development</text>
          <text x="98" y="228">Angular</text>
        </g>
        <g stroke="#475569" stroke-width="3" fill="none">
          <path d="M20 50v42h20M20 92v64h20M60 178v42h20" />
        </g>
        <!-- The AI's suggestion: a new folder, dashed until approved -->
        <rect x="80" y="262" width="190" height="44" rx="10" fill="none" stroke="#c084fc" stroke-width="3" stroke-dasharray="8 6" />
        <text x="98" y="292" fill="#e9d5ff">✨ Docker</text>
        <path d="M60 220v64h20" stroke="#c084fc" stroke-width="3" fill="none" stroke-dasharray="8 6" />
        <!-- Links coming in -->
        <g fill="#818cf8">
          <path d="M300 20h22v40l-11-8-11 8z" />
          <path d="M345 70h22v40l-11-8-11 8z" />
          <path d="M300 130h22v40l-11-8-11 8z" />
        </g>
        <g fill="#c084fc">
          <path d="M360 200h22v40l-11-8-11 8z" />
        </g>
      </svg>
    </div>
    <div class="words">
      <h1>BOOKMARKHUB</h1>
      <h2>Chrome bookmarks, synced and sorted</h2>
      <p>A browser extension, n8n and PostgreSQL, with AI folder suggestions you approve.</p>
      <div class="chips">
        <span>Chrome extension</span>
        <span>n8n</span>
        <span>PostgreSQL</span>
        <span>Angular</span>
        <span>Local AI</span>
      </div>
      <div class="site">
        <img src="../../dashboard/public/favicon.svg" width="40" height="40" alt="" />
        jarllindquist.com/bookmarks
      </div>
    </div>
  </div>
</body>

</html>
