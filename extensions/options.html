<!DOCTYPE html>
<html lang="sv">

<head>
    <meta charset="UTF-8">
    <title>Bokmärkessync – inställningar</title>
    <style>
        body {
            width: 320px;
            padding: 15px;
            font-family: sans-serif;
        }

        input {
            width: 100%;
            box-sizing: border-box;
            padding: 6px;
            margin: 6px 0 10px;
        }

        button {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 4px;
            cursor: pointer;
        }

        #status {
            margin-top: 8px;
            font-size: 12px;
            color: #666;
        }
    </style>
</head>

<body>
    <label for="token">Nyckel (X-Bookmark-Token)</label>
    <input id="token" type="password" autocomplete="off">
    <button id="saveBtn">Spara</button>
    <div id="status"></div>

    <script src="api.js"></script>
    <script src="options.js"></script>
</body>

</html>
